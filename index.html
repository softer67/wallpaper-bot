<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4K Live Wallpaper Studio</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #0b192c; 
            color: #fff; 
            text-align: center; 
            padding: 20px; 
        }
        #telegram-login-container { 
            margin: 20px auto; 
            display: flex;
            justify-content: center;
        }
        #authStatusText {
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        .logout-btn {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .logout-btn:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>
    <h1>4K Live Wallpaper Studio</h1>
    <div id="authStatusText">Вы не вошли в аккаунт</div>
    <button id="logoutBtn" class="logout-btn" onclick="logout()">Выйти</button>

    <div id="telegram-login-container">
        <script async src="https://telegram.org/js/telegram-widget.js?22" 
                data-telegram-login="helper_4k_wallpapers_bot" 
                data-size="large" 
                data-request-access="write"
                data-onauth="onTelegramAuth(user)">
        </script>
    </div>

    <script>
        function onTelegramAuth(user) {
            localStorage.setItem('tg_user', JSON.stringify(user));
            updateUI(user);
        }

        function updateUI(user) {
            const statusEl = document.getElementById('authStatusText');
            const loginContainer = document.getElementById('telegram-login-container');
            const logoutBtn = document.getElementById('logoutBtn');

            if (user) {
                statusEl.innerHTML = `Привет, <b>${user.first_name}</b>! (@${user.username || user.id})`;
                statusEl.style.color = '#4CAF50';
                loginContainer.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
            } else {
                statusEl.textContent = 'Вы не вошли в аккаунт';
                statusEl.style.color = '#fff';
                loginContainer.style.display = 'flex';
                logoutBtn.style.display = 'none';
            }
        }

        function logout() {
            localStorage.removeItem('tg_user');
            updateUI(null);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('tg_user');
            if (saved) {
                try {
                    updateUI(JSON.parse(saved));
                } catch (e) {
                    localStorage.removeItem('tg_user');
                }
            }
        });
    </script>
</body>
</html>
