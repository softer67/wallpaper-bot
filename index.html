<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4K Live Wallpaper Studio</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #0b192c; 
            color: #fff; 
            text-align: center; 
            padding: 20px; 
        }
        #telegram-login-container { 
            margin: 20px auto; 
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>
    <h1>4K Live Wallpaper Studio</h1>
    <div id="authStatusText">Вы не вошли в аккаунт</div>

    <!-- Контейнер для кнопки входа через Telegram -->
    <div id="telegram-login-container"></div>

    <script>
      // Функция срабатывает при успешном входе через виджет Telegram
      function onTelegramAuth(user) {
        fetch('/api/auth/telegram', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(user)
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            window.location.reload(); // Перезагрузка страницы после входа
          } else {
            alert('Ошибка авторизации: ' + data.message);
          }
        })
        .catch(err => console.error('Ошибка:', err));
      }
    </script>

    <!-- Официальный скрипт виджета авторизации Telegram -->
    <script async src="https://telegram.org/js/telegram-widget.js?22" 
            data-telegram-login="helper_4k_wallpapers_bot" 
            data-size="large" 
            data-onauth="onTelegramAuth(user)" 
            data-request-access="write">
    </script>
</body>
</html>
